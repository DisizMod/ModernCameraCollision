; ModernCameraCollision -- the mod's defaults. The user's values are kept by
; MCM Helper in Data/MCM/Settings/ModernCameraCollision.ini over these.

[General]
bEnabled = 1

[Motion]
; the pulled-in distance is kept this long after the way clears (seconds)
fHoldSecs = 0.3
; time constant of the way in; small, since the engine parks the camera a few
; units short of a surface and easing toward that point is time spent inside it
fEaseInSecs = 0.06
; time constant of the way back out
fEaseOutSecs = 0.25

[Rules]
; small: the shape under the hit with a bound radius under this is faded and
; never collides; at or above, the disc decides
fMinBound = 100
; the body as the camera sees it: a stadium -- a rectangle with rounded ends --
; upright in the plane facing the camera, about the pivot: half-width for the
; shoulders, a height above the pivot for the head, one below for the legs
fBodyHalfWidth = 30
fBodyAbove = 30
fBodyBelow = 100
; the sample grid across the body (3-7) and down it (3-9); points outside the
; stadium are left out
iBodyColumns = 5
iBodyRows = 5
; a horizontal line of samples at the pivot's height, across the camera's line,
; reaching this far past the body's edge on both sides, with this many samples
; per side: what is beside the player, for telling a pole from a wall
fSideReach = 120
iSidePoints = 3
; how many side lines, at heights spread over the bumper as the grid's rows are
iSideRows = 1
; from a high (or low) angle -- the camera more than this many degrees above or
; below level -- the body is seen end-on: only the cap facing the camera is
; sampled, at this share of the width, and the side line becomes a cross
fHighAngle = 45
fHighScale = 0.6
; points round the high-angle disc's edge
iHighPoints = 8
; dropped when the occluder takes less of the disc than this
iDropBelowPercent = 75
; a hit on the occluder counts only within this distance of the sweep's own
; hit: the same part of it. A house is one reference; its pillar and its
; wall are told apart by where they were hit
fPartDistance = 80

[Prediction]
bPredictionRays = 1
bVertical = 1
bDiagonal = 1
; the near prediction rays cap the distance at what they measure free
bShorten = 1
; turn the camera away from a blocked side: off until the player's heading
; and input come into it
bSwing = 0
fSwingYawDegPerSec = 60
fSwingPitchDegPerSec = 40
bSwingYawInverted = 1
bSwingPitchInverted = 1
bIntentWins = 1

[Fade]
bFade = 1
fAlpha = 0.3
fSecs = 0.2
; fade shapes that carry an alpha property of their own (a window: its shadow goes)
bFadeOwnAlpha = 0
; the shadow pass sees faded shapes as they were
bKeepShadows = 1

[Layers]
; a rule per collision layer L_CAMERA collides with: 0 measure, 1 stop,
; 2 through (never stops, not faded), 3 fade (never stops, faded whole)
iL_STATIC = 0
iL_ANIMSTATIC = 0
iL_TREES = 3
iL_TERRAIN = 1
iL_GROUND = 1

[Debug]
bDrawDiscs = 0
bDrawPredictionRays = 0
bDrawRays = 0
bDrawBounds = 0
bLogVerbose = 0
