; ModernCameraCollision -- the mod's defaults. The user's values are kept by
; MCM Helper in Data/MCM/Settings/ModernCameraCollision.ini over these.

[General]
bEnabled = 1

[Motion]
; the pulled-in distance is kept this long after the way clears (seconds)
fHoldSecs = 0.3
; time constant of the way in; small, since the engine parks the camera a few
; units short of a surface and easing toward that point is time spent inside it
fEaseInSecs = 0.06
; time constant of the way back out
fEaseOutSecs = 0.25

[Rules]
; small: the shape under the hit with a bound radius under this is faded and
; never collides; at or above, the disc decides
fMinBound = 100
; the body as the camera sees it: a stadium -- a rectangle with rounded ends --
; upright in the plane facing the camera, about the pivot: half-width for the
; shoulders, a height above the pivot for the head, one below for the legs
fBodyHalfWidth = 30
fBodyAbove = 30
fBodyBelow = 100
; sample rings of eight on the outline and inside it, plus the centre (1-3)
iDiscRings = 2
; dropped when the occluder takes less of the disc than this
iDropBelowPercent = 75
; a hit on the occluder counts only within this distance of the sweep's own
; hit: the same part of it. A house is one reference; its pillar and its
; wall are told apart by where they were hit
fPartDistance = 80

[Whiskers]
bWhiskers = 1
bVertical = 1
bDiagonal = 1
; the near whiskers cap the distance at what they measure free
bShorten = 1
; turn the camera away from a blocked side: off until the player's heading
; and input come into it
bSwing = 0
fSwingYawDegPerSec = 60
fSwingPitchDegPerSec = 40
bSwingYawInverted = 1
bSwingPitchInverted = 1
bIntentWins = 1

[Fade]
bFade = 1
fAlpha = 0.3
fSecs = 0.2
; fade shapes that carry an alpha property of their own (a window: its shadow goes)
bFadeOwnAlpha = 0
; the shadow pass sees faded shapes as they were
bKeepShadows = 1

[Layers]
; a rule per collision layer L_CAMERA collides with: 0 measure, 1 stop, 2 through
iL_STATIC = 0
iL_ANIMSTATIC = 0
iL_TREES = 2
iL_TERRAIN = 1
iL_GROUND = 1

[Debug]
bDrawDiscs = 0
bDrawWhiskers = 0
bDrawRays = 0
bDrawBounds = 0
bLogVerbose = 0
