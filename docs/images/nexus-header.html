<!doctype html>
<html><head><meta charset="utf-8"><title>Modern Camera Collision</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0b0d10; }
  .card { zoom: 2; position: relative; width: 1280px; height: 720px; overflow: hidden; color: #efe6d2;
    background: radial-gradient(900px 500px at 50% 45%, #1b2230 0%, #0b0d10 70%); font-family: "Cormorant Garamond", Georgia, serif; }
  .title { position: absolute; left: 0; right: 0; top: 400px; text-align: center; font-family: Cinzel, serif; font-weight: 700;
    font-size: 72px; letter-spacing: 2px; line-height: 1.1; text-shadow: 0 2px 24px rgba(0,0,0,.7); }
  .sub { position: absolute; left: 0; right: 0; top: 570px; text-align: center; font-size: 26px; font-weight: 600; letter-spacing: 6px;
    color: #b89a5c; text-transform: uppercase; }
  svg { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); }
</style></head>
<body><div class="card">
<svg width="520" height="300" viewBox="0 0 520 300" fill="none">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e2c37a" stop-opacity=".5"/><stop offset="1" stop-color="#e2c37a" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- wall -->
  <rect x="404" y="20" width="96" height="260" rx="6" fill="#2a3038"/>
  <rect x="404" y="20" width="6" height="260" fill="#4a525d"/>
  <!-- the camera, stopped at the wall, glowing -->
  <circle cx="350" cy="150" r="90" fill="url(#glow)"/>
  <rect x="330" y="126" width="64" height="44" rx="8" fill="#efe6d2"/>
  <path d="M330 138 L308 124 L308 172 L330 158 Z" fill="#efe6d2"/>
  <circle cx="372" cy="148" r="10" fill="#0b0d10"/>
  <!-- the player, a simple figure -->
  <circle cx="70" cy="86" r="22" fill="#c9c2b3"/>
  <path d="M70 110 L70 200 M70 130 L36 176 M70 130 L104 172 M70 200 L46 268 M70 200 L96 268" stroke="#c9c2b3" stroke-width="12" stroke-linecap="round"/>
  <!-- a soft dashed line from the player to the camera -->
  <path d="M110 150 L296 150" stroke="#e2c37a" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round" opacity=".8"/>
</svg>
<div class="title">Modern Camera Collision</div>
<div class="sub">Skyrim SE · AE · SKSE</div>
</div></body></html>
